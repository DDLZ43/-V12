<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title></title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background:#F5F7FA; color:#333; line-height:1.6;
  min-height:100vh; -webkit-tap-highlight-color:transparent;
}
/* ===== 密码锁 ===== */
#lockScreen {
  position:fixed; inset:0; background:linear-gradient(135deg,#5B8FF9,#7AA6FF);
  display:flex; align-items:center; justify-content:center; z-index:999;
}
#lockScreen .lock-box {
  background:#fff; border-radius:16px; padding:40px 32px; width:320px;
  box-shadow:0 10px 40px rgba(0,0,0,0.15); text-align:center;
}
#lockScreen .lock-icon { font-size:42px; margin-bottom:12px; }
#lockScreen h3 { color:#5B8FF9; font-size:20px; margin-bottom:6px; }
#lockScreen p { color:#888; font-size:14px; margin-bottom:20px; }
#lockScreen input {
  width:100%; padding:12px; border:1px solid #D9D9D9; border-radius:10px;
  font-size:20px; text-align:center; letter-spacing:6px; outline:none; margin-bottom:14px;
}
#lockScreen input:focus { border-color:#5B8FF9; box-shadow:0 0 0 3px rgba(91,143,249,.15); }
#lockScreen button {
  width:100%; padding:12px; background:#5B8FF9; color:#fff; border:none;
  border-radius:10px; font-size:16px; font-weight:600; cursor:pointer;
}
#lockScreen button:hover { background:#4A7DE4; }
#lockErr { color:#FF4D4F; font-size:13px; margin-bottom:10px; min-height:18px; display:none; }

/* ===== 工具页面 ===== */
#toolScreen { display:none; }
.top-header {
  background:#fff; border-bottom:1px solid #E8E8E8; box-shadow:0 2px 8px rgba(0,0,0,.04);
  position:sticky; top:0; z-index:200;
}
.header-inner {
  max-width:1100px; margin:0 auto; padding:0 16px; height:56px;
  display:flex; align-items:center; justify-content:space-between;
}
.logo-text { font-size:16px; font-weight:700; color:#5B8FF9; letter-spacing:.5px; }
.hidden-tag { font-size:12px; background:#F0F5FF; color:#5B8FF9; padding:3px 10px; border-radius:12px; }
.edit-link {
  font-size:13px; color:#5B8FF9; background:#F0F5FF; text-decoration:none;
  padding:6px 14px; border-radius:14px; font-weight:600; white-space:nowrap;
  display:inline-flex; align-items:center; gap:4px; transition:all .2s;
}
.edit-link:hover { background:#E4EEFF; color:#3A6FD8; }
.main-wrap { max-width:1100px; margin:0 auto; padding:24px 16px 60px; }

.card { background:#fff; border-radius:12px; box-shadow:0 2px 12px rgba(0,0,0,.06); padding:20px; margin-bottom:16px; }
.card-title { display:flex; align-items:center; gap:10px; margin-bottom:16px; }
.title-bar { width:4px; height:20px; background:#5B8FF9; border-radius:2px; }
.card-title h2 { font-size:17px; font-weight:700; color:#333; }

.query-row { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.query-row label { font-size:14px; color:#555; font-weight:500; white-space:nowrap; }
.query-row input {
  padding:10px 14px; border:1px solid #D9D9D9; border-radius:10px; font-size:15px;
  min-width:200px; background:#fff; transition:border-color .2s;
}
.query-row input:focus { outline:none; border-color:#5B8FF9; }
.input-wrap { position:relative; display:inline-block; }
.suggest-list {
  position:absolute; top:calc(100% + 6px); left:0; right:0; background:#fff;
  border:1px solid #E8E8E8; border-radius:10px; max-height:240px; overflow-y:auto;
  z-index:100; display:none; list-style:none; box-shadow:0 8px 24px rgba(0,0,0,.12); padding:6px 0;
}
.suggest-list.show { display:block; }
.suggest-list li { padding:9px 14px; cursor:pointer; font-size:15px; }
.suggest-list li:hover, .suggest-list li.active { background:#F0F5FF; color:#5B8FF9; }
.suggest-list li .hl { color:#FF4D4F; font-weight:700; }
.suggest-list .no-match { color:#999; cursor:default; text-align:center; }

.btn-blue {
  padding:10px 20px; background:#5B8FF9; color:#fff; border:none; border-radius:10px;
  font-size:15px; cursor:pointer; transition:all .2s; font-weight:500;
}
.btn-blue:hover { background:#4A7DE4; transform:translateY(-1px); }

.btn-green {
  padding:12px 24px; background:#52c41a; color:#fff; border:none; border-radius:10px;
  font-size:15px; cursor:pointer; font-weight:600; box-shadow:0 4px 12px rgba(82,196,26,.3);
}
.btn-green:hover { background:#45a317; }
.btn-orange {
  padding:12px 24px; background:#FA8C16; color:#fff; border:none; border-radius:10px;
  font-size:15px; cursor:pointer; font-weight:600; box-shadow:0 4px 12px rgba(250,140,22,.3);
}
.btn-orange:hover { background:#E07B0A; }

.toolbar { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-top:12px; }
.date-input { border:1px solid #D9D9D9; border-radius:10px; padding:10px 14px; font-size:15px; }

/* 星期节次选择区 */
.week-group { margin-bottom:6px; }
.week-head {
  display:flex; align-items:center; gap:10px; padding:10px 12px; background:#F0F5FF;
  border-radius:10px; margin-bottom:8px; cursor:pointer; user-select:none;
}
.week-head:hover { background:#E4EEFF; }
.week-head .week-name { font-weight:700; color:#5B8FF9; font-size:15px; }
.week-head .week-count { color:#888; font-size:13px; margin-left:auto; }
.day-select-btn {
  display:inline-block; padding:4px 12px; background:#5B8FF9; color:#fff;
  border-radius:14px; font-size:12px; cursor:pointer; margin-left:10px; font-weight:600;
  flex-shrink:0; user-select:none;
}
.day-select-btn:hover { background:#4A7DE4; }
.week-body { padding-left:8px; display:none; }
.week-body.open { display:block; }
.period-row {
  display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:8px;
  margin-bottom:4px; border:1px solid #F0F0F0; cursor:pointer; transition:background .15s;
}
.period-row:hover { background:#FAFBFC; }
.period-row.selected { background:#EBF7FF; border-color:#91D5FF; }
.period-row input[type=checkbox] { width:18px; height:18px; accent-color:#5B8FF9; flex-shrink:0; }
.period-info { font-size:14px; color:#333; }
.period-info .cls { color:#5B8FF9; font-weight:600; }
.period-info .bz { color:#FA8C16; font-size:12px; margin-left:6px; }

/* 通知预览区 */
#notifPreview {
  background:#F8F9FB; border:1px solid #E8E8E8; border-radius:10px; padding:16px;
  font-family:"SF Mono",Consolas,monospace; font-size:13px; white-space:pre-wrap; line-height:1.8;
  min-height:120px; display:none; max-height:400px; overflow-y:auto;
}
.copy-bar { display:flex; gap:10px; align-items:center; margin-top:12px; }
#copyHint { color:#52c41a; font-size:13px; display:none; }

.accum-bar {
  background:#FFF7E6; border:1px solid #FFD591; color:#D46B08; padding:10px 14px;
  border-radius:10px; font-size:13px; margin-bottom:12px; display:none; line-height:1.7;
}
.bar-btn {
  display:inline-block; padding:5px 14px; border:1px solid #FFD591; color:#D46B08;
  border-radius:8px; font-size:12px; cursor:pointer; margin-right:8px; background:#fff;
}
.bar-btn:hover { background:#FFF1D6; }

.page-footer { text-align:center; padding:16px; color:#AAA; font-size:12px; }

@media (max-width:768px){
  .query-row, .toolbar { flex-direction:column; align-items:stretch; }
  .query-row label { margin-bottom:-4px; }
  .query-row input, .input-wrap, .date-input { width:100%; min-width:auto; font-size:16px; }
  .btn-blue, .btn-green, .btn-orange { width:100%; }
}
</style>
</head>
<body>

<!-- ===== 密码锁 ===== -->
<div id="lockScreen">
  <div class="lock-box">
    <div class="lock-icon">🔒</div>
    <h3>请输入口令</h3>
    <p>本工具需口令访问</p>
    <input type="password" id="lockInput" autocomplete="off" maxlength="20">
    <div id="lockErr">口令错误，请重试</div>
    <button id="btnUnlock">进入</button>
  </div>
</div>

<!-- ===== 工具页面 ===== -->
<div id="toolScreen">
  <header class="top-header">
    <div class="header-inner">
      <span class="logo-text">📑 代课通知工具</span>
      <div style="display:flex;align-items:center;gap:10px;">
        <a href="editor.html" target="_self" class="edit-link">✏️ 课表编辑</a>
        <span class="hidden-tag">内部</span>
      </div>
    </div>
  </header>

  <div class="main-wrap">

    <!-- 查询教师 -->
    <div class="card">
      <div class="card-title"><span class="title-bar"></span><h2>教师请假登记</h2></div>
      <div class="query-row">
        <label>教师姓名：</label>
        <div class="input-wrap">
          <input type="text" id="teacherInput" placeholder="输入并选择教师姓名" autocomplete="off">
          <ul id="teacherSuggest" class="suggest-list"></ul>
        </div>
        <button id="btnQuery" class="btn-blue">🔍 查询课程</button>
      </div>
      <div class="toolbar">
        <span>请假日期：</span>
        <input type="date" id="leaveDate" class="date-input">
        <button id="btnSelectAll" class="btn-green">☑ 全选</button>
      </div>
    </div>

    <!-- 累积池状态栏 -->
    <div id="accumBar" class="accum-bar"></div>

    <!-- 星期节次选择 -->
    <div class="card">
      <div class="card-title"><span class="title-bar"></span><h2>勾选需代课的节次</h2></div>
      <div id="scheduleArea"></div>
    </div>

    <!-- 生成操作 -->
    <div class="card">
      <div class="card-title"><span class="title-bar"></span><h2>生成操作</h2></div>
      <div class="toolbar">
        <button id="btnRecord" class="btn-green">📥 生成记录(加入累积)</button>
        <button id="btnExport" class="btn-orange">📊 导出Excel(全部累积)</button>
        <button id="btnClearAll" class="btn-blue" style="background:#999">🗑 清空累积</button>
      </div>
    </div>

    <!-- 通知预览 -->
    <div class="card">
      <div class="card-title"><span class="title-bar"></span><h2>代课通知</h2></div>
      <div id="notifPreview"></div>
      <div class="copy-bar">
        <button id="btnCopy" class="btn-orange">📋 一键复制到微信</button>
        <span id="copyHint">✅ 已复制，请粘贴到微信</span>
      </div>
    </div>

  </div>

  <footer class="page-footer">内部工具</footer>
</div>

<script src="js/data-loader.js"></script>
<script src="js/daike-config.js"></script>
<script src="lib/xlsx.full.min.js"></script>
<script src="js/daike.js"></script>
</body>
</html>
