<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>白沙小学代课系统</title>
<link rel="stylesheet" href="css/style.css">
<style>
.editor-wrap { max-width: 1000px; margin: 20px auto; padding: 20px; }
.editor-bar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; }
.editor-bar label { font-size: 14px; color: #555; margin: 0; }
.editor-bar select { padding: 8px 12px; border: 1px solid #d0d0d0; border-radius: 8px; font-size: 14px; outline: none; }
.editor-bar select:focus { border-color: #5B8FF9; }
.editor-bar .btn { padding: 8px 16px; border: none; border-radius: 8px; color: #fff; font-size: 14px; cursor: pointer; }
.btn-save { background: #52c41a; }
.btn-add { background: #5B8FF9; }
.btn-export { background: #fa8c16; }
.ecard { background: #fff; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.06); padding: 20px; margin-bottom: 16px; }
.ecard h3 { font-size: 16px; color: #5B8FF9; margin-bottom: 12px; }
/* ===== 编辑器课表：套用 index.html「班级课表」显示效果 ===== */
.editor-table-shell { padding: 0; margin: 0; overflow-x: auto; overflow-y: hidden; -webkit-overflow-scrolling: touch; }
.editor-table { width: auto; min-width: 620px; margin: 0 auto; border-collapse: separate; border-spacing: 0; font-size: 13px; }
.editor-table thead tr { height: 36px; }
.editor-table th, .editor-table td { border: 1px solid #E8E8E8; padding: 6px 3px; text-align: center; vertical-align: middle; white-space: nowrap; }
.editor-table th { background: linear-gradient(135deg, #5B8FF9 0%, #7AA6FF 100%); color: #fff; font-weight: 600; font-size: 14px; height: 36px; padding: 0 8px; }
.editor-table .time-col { background: #E8F4FF; color: #3B6DB5; font-weight: 700; width: 26px !important; min-width: 26px !important; max-width: 26px !important; font-size: 13px; position: sticky; left: 0; z-index: 10; border-right: 2px solid #D0E3FF; padding: 6px 2px; }
.editor-table .day-header { width: 116px; min-width: 116px; max-width: 116px; }
.editor-table tbody tr { height: 58px; }
.editor-table tbody td { width: 116px; min-width: 116px; max-width: 116px; padding: 4px 3px; }
/* 课程格子：仿 index 的 course-box，内含两个可编辑输入框 */
.editor-table .course-box { background: #F0F7FF; border-radius: 6px; padding: 3px 3px; margin: 1px 1px; height: 46px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; }
.editor-table .cell-input { width: 100%; box-sizing: border-box; border: 1px solid transparent; text-align: center; padding: 1px 1px; font-size: 12px; outline: none; background: transparent; border-radius: 4px; }
.editor-table .cell-input:focus { border-color: #5B8FF9; background: #fff; }
.editor-table .cell-input.course { font-weight: 700; color: #2C4A7C; }
.editor-table .cell-input.course::placeholder { color: #A9C4F0; font-weight: 700; font-size: 11px; }
.editor-table .cell-input.teacher { border-top: 1px dashed #CFE2FF; color: #5B8FF9; }
.editor-table .cell-input.teacher::placeholder { color: #A9C4F0; font-size: 11px; }
.editor-table td:hover .course-box { background: #E0EDFF; }
.editor-table tbody tr:hover { background: #FAFBFC; }

/* ===== 教师通讯录：卡片网格（仿 index.html 通讯录卡片样式） ===== */
.contacts-search { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.contacts-search .search-icon { font-size: 15px; color: #999; }
.contacts-search input {
  flex: 1;
  padding: 9px 12px;
  border: 1px solid #D9D9D9;
  border-radius: 8px;
  font-size: 14px;
  outline: none;
  background: #fff;
  transition: border-color .2s, box-shadow .2s;
}
.contacts-search input:focus { border-color: #5B8FF9; box-shadow: 0 0 0 3px rgba(91,143,249,0.15); }
.contacts-search .btn-clear { background: #ff4d4f; color: #fff; border: none; border-radius: 8px; padding: 8px 14px; font-size: 13px; cursor: pointer; }
.contacts-search .btn-clear:hover { background: #e64545; }
.contact-count { font-size: 13px; color: #999; margin-bottom: 10px; }
.contact-count b { color: #5B8FF9; }
.contacts-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
.contact-edit-card { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 14px; background: #FAFAFA; border-radius: 10px; border: 1px solid #F0F0F0; transition: all .2s; }
.contact-edit-card:hover { background: #F0F5FF; border-color: #5B8FF9; transform: translateY(-2px); box-shadow: 0 4px 12px rgba(91,143,249,0.1); }
.contact-edit-card input { border: 1px solid #E0E0E0; border-radius: 8px; padding: 8px 10px; font-size: 14px; outline: none; background: #fff; transition: border-color .2s; }
.contact-edit-card input:focus { border-color: #5B8FF9; box-shadow: 0 0 0 3px rgba(91,143,249,0.15); }
.contact-edit-card input[data-field=name] { width: 150px; font-weight: 600; color: #333; }
.contact-edit-card input[data-field=phone] { width: 170px; color: #5B8FF9; }
.hint-line { background: #f6f8ff; border-left: 4px solid #5B8FF9; padding: 10px 14px; border-radius: 0 8px 8px 0; margin-bottom: 16px; font-size: 13px; color: #555; line-height: 1.6; }

/* ===== 移动端适配 ===== */
@media (max-width: 768px) {
  .editor-table { min-width: 520px; font-size: 12px; }
  .editor-table th { font-size: 13px; height: 34px; padding: 0 6px; }
  .editor-table .time-col { width: 36px !important; min-width: 36px !important; max-width: 36px !important; font-size: 12px; padding: 4px 2px; }
  .editor-table .day-header { width: 96px; min-width: 96px; max-width: 96px; }
  .editor-table tbody tr { height: 52px; }
  .editor-table tbody td { width: 96px; min-width: 96px; max-width: 96px; padding: 3px 2px; }
  .editor-table .course-box { height: 42px; padding: 2px 2px; }
  .editor-table .cell-input { font-size: 12px; }
  .contacts-grid { grid-template-columns: 1fr; }
  .contact-edit-card input[data-field=name] { flex: 1; width: auto; min-width: 80px; }
  .contact-edit-card input[data-field=phone] { flex: 1; width: auto; }
}
</style>
</head>
<body>

<header class="top-header">
  <div class="header-inner">
    <div class="logo-area">
      <span class="logo-icon">🏫</span>
      <span class="logo-text">白沙小学代课系统</span>
    </div>
    <nav class="top-nav">
      <a href="daike.html?auto=1" class="nav-btn"><span class="nav-icon">📑</span>返回代课</a>
      <a href="index.html" class="nav-btn"><span class="nav-icon">📋</span>查看课表</a>
      <a href="editor.html" class="nav-btn active"><span class="nav-icon">✏️</span>修改数据</a>
      <a href="import.html" class="nav-btn"><span class="nav-icon">📥</span>导入数据</a>
    </nav>
  </div>
</header>

<div class="editor-wrap">
  <div class="hint-line">
    用法：<b>选班级</b> → 表格里直接点格子<b>改课程/教师</b>，改完点 <b>保存并导出 data.json</b>，用下载的文件替换 <code>js/data.json</code> 即可上线。<br>
    新增格子：某节原本空白，直接在对应格输入内容，保存后就有这一节了。<br>
    下图横的是<b>星期</b>，竖的是<b>节次</b>。教室/课程旁可加备注。
  </div>

  <div class="editor-bar">
    <label>选班级</label>
    <select id="classSelect"></select>
    <button class="btn btn-save" id="btnSave">💾 保存并导出 data.json</button>
    <button class="btn btn-add" id="btnMissing">❓ 这节课没显示？</button>
  </div>

  <div class="ecard">
    <h3 id="currentClassTitle">请选择班级</h3>
    <div id="tableWrap">请先在上方选择班级</div>
  </div>

  <div class="ecard">
    <h3>教师通讯录（可以修改号码）</h3>
    <div class="contacts-search">
      <span class="search-icon">🔍</span>
      <input type="text" id="contactSearch" placeholder="输入教师姓名搜索，如：张三" autocomplete="off">
      <button class="btn btn-clear" id="btnClearSearch">✕ 清空</button>
    </div>
    <div id="contactCount" class="contact-count"></div>
    <div class="contacts-box" id="contactsBox"></div>
  </div>
</div>

<footer class="page-footer">
  <p>白沙小学课表系统 · 简约清新版（编辑器）</p>
</footer>

<script src="js/data-loader.js"></script>
<script>
// 当前编辑的班级
var currentClass = '';
var DAYS = ['星期一','星期二','星期三','星期四','星期五'];
var PERIODS = [1,2,3,4,5,6];

var classSelect = document.getElementById('classSelect');
var tableWrap = document.getElementById('tableWrap');
var titleEl = document.getElementById('currentClassTitle');

function fillClassSelect() {
  var classes = Object.keys(scheduleData).sort(function(a,b){
    var gO = {'一':1,'二':2,'三':3,'四':4,'五':5,'六':6};
    var gA=gO[a.charAt(0)]||0, gB=gO[b.charAt(0)]||0;
    if(gA!==gB) return gA-gB;
    var m1=a.match(/[0-9]+/), m2=b.match(/[0-9]+/);
    return ((m1?+m1[0]:0)-(m2?+m2[0]:0));
  });
  classSelect.innerHTML = '';
  classes.forEach(function(c){
    var o=document.createElement('option');
    o.value=c; o.textContent=c+"班";
    classSelect.appendChild(o);
  });
  if(classes.length) { currentClass=classes[0]; classSelect.value=classes[0]; }
}

function renderClassTable() {
  var cls = currentClass;
  if(!cls){ tableWrap.innerHTML='请选择班级'; return; }
  titleEl.textContent = cls + '班  课表（点格子可直接修改）';
  var data = scheduleData[cls] || {};
  var html = '<div class="editor-table-shell"><table class="editor-table"><thead><tr><th class="time-col">节次</th>';
  DAYS.forEach(function(d){ html += '<th class="day-header">'+d+'</th>'; });
  html += '</tr></thead><tbody>';
  PERIODS.forEach(function(p){
    // 节次内容精简为数字，方便手机上修改
    html += '<tr><td class="time-col">'+p+'</td>';
    DAYS.forEach(function(d){
      var cell = data[d] && data[d][p] ? data[d][p] : null;
      var course = cell ? cell.course : '';
      var teacher = cell ? cell.teacher : '';
      html += '<td><div class="course-box">'+
              '<input class="cell-input course" data-class="'+cls+'" data-day="'+d+'" data-period="'+p+'" data-field="course" value="'+esc(course)+'" placeholder="课程">'+
              '<input class="cell-input teacher" data-class="'+cls+'" data-day="'+d+'" data-period="'+p+'" data-field="teacher" value="'+esc(teacher)+'" placeholder="教师">'+
              '</div></td>';
    });
    html += '</tr>';
  });
  html += '</tbody></table></div>';
  tableWrap.innerHTML = html;
}

function esc(s){ return String(s||'').replace(/"/g,'&quot;').replace(/&/g,'&amp;'); }

var contactKeyword = '';
var contactShowAll = false;
var CONTACT_PAGE_SIZE = 5; // 默认只展示前 5 条

function renderContacts() {
  var box = document.getElementById('contactsBox');
  var countEl = document.getElementById('contactCount');
  var list = contactsData || [];

  // 关键词过滤（支持：中文姓名、电话、拼音首字母，大小写均可）
  var filtered = [];
  var kwRaw = (contactKeyword || '').trim();
  var kw = kwRaw.toLowerCase();
  var isAlpha = /^[a-zA-Z]+$/.test(kwRaw); // 纯字母 → 按姓名首字母/名字子串匹配
  if (kw) {
    for (var i = 0; i < list.length; i++) {
      var nm = (list[i].name || '').toLowerCase();
      var ph = (list[i].phone || '').toLowerCase();
      var hit = false;
      if (isAlpha) {
        hit = matchName(list[i].name, kwRaw); // 首字母 + 名字子串
      } else {
        hit = (nm.indexOf(kw) !== -1) || (ph.indexOf(kw) !== -1);
      }
      if (hit) {
        filtered.push({ index: i, item: list[i] });
      }
    }
  } else {
    for (var i = 0; i < list.length; i++) {
      filtered.push({ index: i, item: list[i] });
    }
  }

  // 未搜索时只展示前 N 条
  var shown = filtered;
  if (!kw && !contactShowAll && filtered.length > CONTACT_PAGE_SIZE) {
    shown = filtered.slice(0, CONTACT_PAGE_SIZE);
  }

  if (!shown.length) {
    box.innerHTML = '<p class="no-result">未找到匹配的教师，请换关键词重试</p>';
    if (countEl) countEl.innerHTML = '共 0 条';
    return;
  }

  var html = '<div class="contacts-grid">';
  for (var k = 0; k < shown.length; k++) {
    var idx = shown[k].index;
    var c = shown[k].item;
    html += '<div class="contact-edit-card">'+
            '<input data-idx="'+idx+'" data-field="name" value="'+esc(c.name)+'" placeholder="姓名">'+
            '<input data-idx="'+idx+'" data-field="phone" value="'+esc(c.phone||'')+'" placeholder="电话">'+
            '</div>';
  }
  html += '</div>';

  // 未搜索且未全部展示时，显示"加载更多"按钮
  if (!kw && !contactShowAll && filtered.length > CONTACT_PAGE_SIZE) {
    html += '<div style="text-align:center;margin-top:12px;">'+
            '<button id="btnMore" class="btn btn-more" style="background:#5B8FF9;color:#fff;border:none;border-radius:8px;padding:9px 20px;font-size:14px;cursor:pointer;">查看全部 ' + filtered.length + ' 位教师</button>'+
            '</div>';
  }

  box.innerHTML = html;

  if (countEl) {
    if (kw) {
      countEl.innerHTML = '找到 <b>' + shown.length + '</b> 位教师';
    } else {
      countEl.innerHTML = '共 <b>' + filtered.length + '</b> 位教师' + (shown.length < filtered.length ? '（当前显示前 ' + shown.length + ' 条，可搜索或点"查看全部"）' : '');
    }
  }

  // 绑定通讯录输入
  box.querySelectorAll('.contact-edit-card input').forEach(function(inp){
    inp.addEventListener('input', function(){
      var idx = +this.getAttribute('data-idx');
      var field = this.getAttribute('data-field');
      if(contactsData[idx]) contactsData[idx][field] = this.value;
    });
  });

  // 绑定"查看全部"按钮
  var btnMore = document.getElementById('btnMore');
  if (btnMore) {
    btnMore.addEventListener('click', function(){
      contactShowAll = true;
      renderContacts();
    });
  }
}

function initContactSearch() {
  var input = document.getElementById('contactSearch');
  var btnClear = document.getElementById('btnClearSearch');
  if (!input) return;
  input.addEventListener('input', function(){
    contactKeyword = this.value;
    contactShowAll = false;
    renderContacts();
  });
  if (btnClear) {
    btnClear.addEventListener('click', function(){
      contactKeyword = '';
      contactShowAll = false;
      input.value = '';
      renderContacts();
    });
  }
}

// 课表格子输入时同步到 scheduleData
function bindTableInputs() {
  tableWrap.querySelectorAll('.cell-input').forEach(function(inp){
    inp.addEventListener('input', function(){
      var cls = this.getAttribute('data-class');
      var day = this.getAttribute('data-day');
      var p = this.getAttribute('data-period');
      var field = this.getAttribute('data-field');
      if(!scheduleData[cls]) scheduleData[cls]={};
      if(!scheduleData[cls][day]) scheduleData[cls][day]={};
      if(!scheduleData[cls][day][p]) scheduleData[cls][day][p]={course:'',teacher:'',room:'-'};
      scheduleData[cls][day][p][field] = this.value;
    });
  });
}

classSelect.addEventListener('change', function(){
  currentClass = this.value;
  renderClassTable();
  bindTableInputs();
});

document.getElementById('btnSave').addEventListener('click', function(){
  var out = {
    scheduleData: scheduleData,
    contactsData: contactsData,
    periods: PERIODS,
    days: DAYS
  };
  var text = JSON.stringify(out, null, 2);
  var blob = new Blob([text], {type:'application/json'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href=url; a.download='data.json'; document.body.appendChild(a); a.click(); document.body.removeChild(a);
  alert('已下载新的 data.json！\n\n接下来三步完成更新：\n1. 用这个文件替换本地的 js/data.json\n2. 双击项目里的「上传.bat」\n3. 等1-2分钟，强刷网页即可看到\n\n（手机/电脑都可这样操作）');
});

document.getElementById('btnMissing').addEventListener('click', function(){
  alert('提示：表格里已经包含全部 6 节 × 5 天。如果某个班级这节课没人教，留空即可（保存后就是空白节）。\n如果某个班级应该超过6节（个别班有第7节），请告诉我，我帮你加上。');
});

// 数据就绪后初始化
__whenDataReady__(function(){
  fillClassSelect();
  renderClassTable();
  bindTableInputs();
  initContactSearch();
  renderContacts();
});
</script>
</body>
</html>
