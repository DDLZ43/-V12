<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>白沙小学课表系统</title>
<link rel="stylesheet" href="css/style.css">
<base target="_blank">
<style>
/* ===== 强制覆盖：标题独占一行，导航在下方 ===== */
.top-header {
  display: block !important;
}
.header-inner {
  display: flex !important;
  flex-direction: column !important;
  align-items: center !important;
  justify-content: center !important;
  height: auto !important;
  padding: 15px 16px 10px !important;
}
.logo-area {
  display: flex !important;
  flex-direction: column !important;
  align-items: center !important;
  justify-content: center !important;
  margin-bottom: 12px !important;
  gap: 4px !important;
  max-width: 100% !important;
}
.logo-text {
  font-size: 24px !important;
  font-weight: bold !important;
  color: #1d4e63 !important;
  letter-spacing: 1px !important;
  text-align: center !important;
  line-height: 1.3 !important;
  white-space: normal !important;
  word-break: break-word !important;
  overflow: visible !important;
  text-overflow: clip !important;
  max-width: 100% !important;
}
.logo-sub {
  font-size: 14px !important;
  font-weight: 600 !important;
  color: #2a8fbd !important;
  letter-spacing: 1.5px !important;
  text-align: center !important;
  white-space: nowrap !important;
  margin-top: 2px !important;
}
/* ===== 底部导航操作栏（固定底部） ===== */
.bottom-nav {
  position: fixed !important;
  left: 0 !important;
  right: 0 !important;
  bottom: 0 !important;
  z-index: 300 !important;
  display: flex !important;
  align-items: center !important;
  justify-content: space-around !important;
  gap: 8px !important;
  padding: 10px 12px !important;
  background: linear-gradient(180deg, rgba(255,255,255,0.7) 0%, #ffffff 60%) !important;
  backdrop-filter: saturate(180%) blur(10px) !important;
  -webkit-backdrop-filter: saturate(180%) blur(10px) !important;
  border-top: 1px solid rgba(150,200,225,0.35) !important;
  box-shadow: 0 -4px 20px rgba(70,150,195,0.10) !important;
  padding-bottom: calc(8px + env(safe-area-inset-bottom)) !important;
}
.bnav-btn {
  flex: 1 !important;
  display: flex !important;
  flex-direction: column !important;
  align-items: center !important;
  justify-content: center !important;
  gap: 3px !important;
  padding: 9px 6px !important;
  color: #6E8294 !important;
  text-decoration: none !important;
  font-size: 13px !important;
  font-weight: 600 !important;
  border: none !important;
  background: transparent !important;
  cursor: pointer !important;
  -webkit-tap-highlight-color: transparent !important;
  font-family: inherit !important;
  border-radius: 12px !important;
  transition: color .2s, background .2s, box-shadow .2s, transform .1s !important;
  position: relative !important;
}
.bnav-btn:hover {
  color: #2a8fbd !important;
  background: rgba(110, 200, 235, 0.16) !important;
}
.bnav-btn:active { transform: scale(0.96) !important; }
.bnav-btn.active {
  color: #ffffff !important;
  background: linear-gradient(135deg, #2f9fcb 0%, #4fc3e0 100%) !important;
  box-shadow: 0 5px 14px rgba(47, 159, 203, 0.35) !important;
}
.bnav-text { font-size: 14px !important; font-weight: 700 !important; }
/* 给固定底部导航留出空间 */
.main-wrap { padding-bottom: 110px !important; }

/* ===== 个人课表查询按钮下移 ===== */
#panel-teacher .query-row {
  position: relative !important;
  display: flex !important;
  flex-wrap: wrap !important;
  align-items: flex-start !important;
  gap: 10px !important;
}
#panel-teacher .input-wrap {
  position: relative !important;
  flex: 1 !important;
  min-width: 200px !important;
}
#panel-teacher #teacher-input {
  width: 100% !important;
  box-sizing: border-box !important;
}
#panel-teacher #teacher-suggest {
  position: absolute !important;
  top: 100% !important;
  left: 0 !important;
  right: 0 !important;
  z-index: 100 !important;
  background: #fff !important;
  border: 1px solid #ddd !important;
  border-radius: 6px !important;
  max-height: 200px !important;
  overflow-y: auto !important;
  box-shadow: 0 4px 10px rgba(0,0,0,0.1) !important;
  margin: 4px 0 0 !important;
  padding: 0 !important;
  list-style: none !important;
}
#btn-teacher-query {
  margin-top: 28px !important;
  align-self: flex-start !important;
}

/* ===== 课表横向滚动 ===== */
.schedule-table {
  display: block !important;
  overflow-x: auto !important;
  white-space: nowrap !important;
  -webkit-overflow-scrolling: touch !important;
  border: 1px solid #e0e0e0 !important;
  border-radius: 8px !important;
}
.schedule-table table {
  min-width: 600px !important;
  width: 100% !important;
  border-collapse: collapse !important;
}
.schedule-table th,
.schedule-table td {
  white-space: nowrap !important;
  padding: 10px 12px !important;
  text-align: center !important;
  border: 1px solid #e0e0e0 !important;
  font-size: 14px !important;
}
.schedule-table td {
  word-break: keep-all !important;
}

/* ===== 班级课表 / 个人课表：滚动表格框对齐编辑器样式（更紧凑） ===== */
#class-result .schedule-table,
#teacher-result .schedule-table {
  display: block !important;
  width: 100% !important;
  max-width: 100% !important;
  box-sizing: border-box !important;
  overflow-x: auto !important;
  overflow-y: hidden !important;
  -webkit-overflow-scrolling: touch !important;
}
#class-result .schedule-table table,
#teacher-result .schedule-table table {
  width: max-content !important;
  min-width: 620px !important;
  max-width: none !important;
  border-collapse: separate !important;
  border-spacing: 0 !important;
}
#class-result .schedule-table thead tr,
#teacher-result .schedule-table thead tr { height: 36px !important; }
#class-result .schedule-table th,
#class-result .schedule-table td,
#teacher-result .schedule-table th,
#teacher-result .schedule-table td {
  white-space: nowrap !important;
  padding: 6px 3px !important;
  font-size: 13px !important;
  border: 1px solid #E8E8E8 !important;
}
#class-result .schedule-table tbody tr,
#teacher-result .schedule-table tbody tr { height: 58px !important; }
#class-result .schedule-table tbody td,
#teacher-result .schedule-table tbody td {
  width: 116px !important;
  min-width: 116px !important;
  max-width: 116px !important;
  padding: 4px 3px !important;
}
#class-result .schedule-table .day-header,
#teacher-result .schedule-table .day-header {
  width: 116px !important;
  min-width: 116px !important;
  max-width: 116px !important;
}
#class-result .schedule-table .time-col,
#teacher-result .schedule-table .time-col {
  width: 40px !important;
  min-width: 40px !important;
  max-width: 40px !important;
  position: sticky;
  left: 0;
  z-index: 10;
  border-right: 2px solid #D0E3FF;
}
#class-result .schedule-table .course-box,
#teacher-result .schedule-table .course-box {
  height: 46px !important;
  padding: 3px 3px !important;
  gap: 1px !important;
}
/* 移动端进一步紧凑 */
@media (max-width: 768px) {
  #class-result .schedule-table table,
  #teacher-result .schedule-table table { width: max-content !important; min-width: 520px !important; max-width: none !important; }
  #class-result .schedule-table thead tr,
  #teacher-result .schedule-table thead tr { height: 34px !important; }
  #class-result .schedule-table tbody tr,
  #teacher-result .schedule-table tbody tr { height: 52px !important; }
  #class-result .schedule-table tbody td,
  #teacher-result .schedule-table tbody td,
  #class-result .schedule-table .day-header,
  #teacher-result .schedule-table .day-header {
    width: 96px !important;
    min-width: 96px !important;
    max-width: 96px !important;
    padding: 3px 2px !important;
  }
  #class-result .schedule-table .course-box,
  #teacher-result .schedule-table .course-box { height: 42px !important; }
}

/* ===== 手机端：标题/导航/查询区压缩，避免过大占满首屏 ===== */
@media (max-width: 768px) {
  .header-inner { padding: 10px 12px 8px !important; }
  .logo-area { margin-bottom: 8px !important; gap: 6px !important; }
  .logo-text { font-size: 20px !important; letter-spacing: .5px !important; }
  .bnav-btn { padding: 8px 4px !important; }
  .bnav-text { font-size: 13px !important; }
  .bottom-nav { padding: 8px 8px !important; gap: 6px !important; }
  .main-wrap { padding-bottom: 118px !important; }
  .card-title h2 { font-size: 16px !important; }
  /* 个人课表查询按钮：去掉多余上留白 + 查询区竖排全宽 */
  #btn-teacher-query { margin-top: 0 !important; }
  #panel-teacher .query-row,
  #panel-class .query-row,
  #panel-contacts .query-row {
    flex-direction: column !important;
    align-items: stretch !important;
    gap: 10px !important;
  }
  #panel-teacher .input-wrap,
  #panel-class .query-row select,
  #panel-contacts .query-row input,
  #teacher-input { width: 100% !important; min-width: auto !important; font-size: 16px !important; }
  #btn-teacher-query,
  #btn-class-query { width: 100% !important; }
}
@media (max-width: 400px) {
  .logo-text { font-size: 18px !important; }
  .bnav-text { font-size: 13px !important; }
}
</style>
</head>
<body>

<header class="top-header">
  <div class="header-inner">
    <div class="logo-area">
      <span class="logo-text">课表速查助手</span>
      <span class="logo-sub">2026 / 08 / 31 版</span>
    </div>
  </div>
</header>

<div class="main-wrap">

  <!-- 班级课表 -->
  <section id="panel-class" class="panel active">
    <div class="card">
      <div class="card-title">
        <span class="title-bar"></span>
        <h2>班级课表查询</h2>
      </div>
      <div class="query-row">
        <label>选择班级：</label>
        <select id="class-select">
          <option value="">请选择班级</option>
        </select>
        <button id="btn-class-query" class="btn-blue">查询课表</button>
      </div>
    </div>
    <div id="class-result" class="card result-card" style="display:none"></div>
  </section>

  <!-- 个人课表 -->
  <section id="panel-teacher" class="panel">
    <div class="card">
      <div class="card-title">
        <span class="title-bar"></span>
        <h2>个人课表查询</h2>
      </div>
      <div class="query-row">
        <label>个人姓名：</label>
        <div class="input-wrap">
          <input type="text" id="teacher-input" placeholder="请输入并选择教师姓名" autocomplete="off">
          <ul id="teacher-suggest" class="suggest-list"></ul>
        </div>
        <button id="btn-teacher-query" class="btn-blue">查询课表</button>
      </div>
    </div>
    <div id="teacher-info" class="card info-card" style="display:none"></div>
    <div id="teacher-result" class="card result-card" style="display:none"></div>
  </section>

  <!-- 通讯录 -->
  <section id="panel-contacts" class="panel">
    <div class="card">
      <div class="card-title">
        <span class="title-bar"></span>
        <h2>教师通讯录</h2>
      </div>
      <div class="query-row">
        <label>搜索教师：</label>
        <input type="text" id="contact-input" placeholder="输入姓名搜索...">
      </div>
    </div>
    <div id="contacts-result" class="card"></div>
  </section>

  <!-- 管理后台 -->
  <section id="panel-admin" class="panel">
    <div class="card">
      <div class="card-title">
        <span class="title-bar"></span>
        <h2>概览</h2>
      </div>
      <div class="stat-grid">
        <div class="stat-box"><span class="stat-num" id="stat-class">0</span><span class="stat-label">班级</span></div>
        <div class="stat-box"><span class="stat-num" id="stat-teacher">0</span><span class="stat-label">教师</span></div>
        <div class="stat-box"><span class="stat-num" id="stat-contact">0</span><span class="stat-label">通讯录</span></div>
      </div>
    </div>
  </section>

</div>

<!-- 底部导航操作栏（固定底部） -->
<nav class="bottom-nav">
  <button class="bnav-btn active" data-tab="class">
    <span class="bnav-text">班级课表</span>
  </button>
  <button class="bnav-btn" data-tab="teacher">
    <span class="bnav-text">个人课表</span>
  </button>
  <button class="bnav-btn" data-tab="contacts">
    <span class="bnav-text">通讯录</span>
  </button>
  <button class="bnav-btn" data-tab="admin">
    <span class="bnav-text">统计</span>
  </button>
</nav>

<footer class="page-footer"></footer>

<script src="js/data-loader.js"></script>
<script src="js/app.js"></script>
<script>
/* ===== 兜底排序：确保班级下拉框顺序绝对正确 ===== */
(function() {
    var select = document.getElementById('class-select');
    if (!select) return;
    function doSort() {
        var opts = Array.from(select.options);
        var placeholder = opts.shift(); // 保留"请选择班级"
        var gradeOrder = { '一': 1, '二': 2, '三': 3, '四': 4, '五': 5, '六': 6 };
        opts.sort(function(a, b) {
            var gA = gradeOrder[a.value.charAt(0)] || 0;
            var gB = gradeOrder[b.value.charAt(0)] || 0;
            if (gA !== gB) return gA - gB;
            var mA = a.value.match(/\d+/);
            var mB = b.value.match(/\d+/);
            var nA = mA ? parseInt(mA[0], 10) : 0;
            var nB = mB ? parseInt(mB[0], 10) : 0;
            return nA - nB;
        });
        select.innerHTML = '';
        select.appendChild(placeholder);
        opts.forEach(function(o) { select.appendChild(o); });
    }
    // DOM 就绪后执行，如果 app.js 已经填充了选项
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
        doSort();
    } else {
        document.addEventListener('DOMContentLoaded', doSort);
    }
})();

/* ===== 管理后台统计（原 admin.html） ===== */
function updateStats() {
  try {
    var classCount = 0, teacherCount = 0, contactCount = 0;

    if (typeof scheduleData !== 'undefined' && scheduleData) {
      classCount = Object.keys(scheduleData).length;
    }

    if (typeof getAllTeachers === 'function') {
      teacherCount = getAllTeachers().length;
    } else if (typeof SCHEDULE_DATA !== 'undefined' && SCHEDULE_DATA) {
      var ts = new Set();
      for (var i = 0; i < SCHEDULE_DATA.length; i++) {
        if (SCHEDULE_DATA[i].teacher) ts.add(SCHEDULE_DATA[i].teacher);
      }
      teacherCount = ts.size;
    }

    if (typeof contactsData !== 'undefined' && contactsData) {
      contactCount = contactsData.length;
    } else if (typeof CONTACTS_DATA !== 'undefined' && CONTACTS_DATA) {
      contactCount = CONTACTS_DATA.length;
    }

    document.getElementById('stat-class').textContent = classCount;
    document.getElementById('stat-teacher').textContent = teacherCount;
    document.getElementById('stat-contact').textContent = contactCount;
  } catch (e) {
    console.error('统计更新失败:', e);
  }
}
if (typeof __whenDataReady__ === 'function') {
  __whenDataReady__(updateStats);
} else {
  updateStats();
}
</script>
</body>
</html>
